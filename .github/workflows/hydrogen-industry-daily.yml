name: Daily hydrogen fuel-cell industry intelligence

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Preview creates an artifact only; send emails the report."
        required: true
        type: choice
        options:
          - preview
          - send
        default: preview

permissions:
  contents: read

concurrency:
  group: hydrogen-industry-daily
  cancel-in-progress: false

jobs:
  build-and-deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      REPORT_MODE: ${{ inputs.mode || 'preview' }}
      SMTP_HOST: smtp.163.com
      SMTP_PORT: "465"
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      REPORT_RECIPIENT: ${{ secrets.REPORT_RECIPIENT }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.6-flash
      PYTHONUTF8: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: false

      - name: Run unit tests
        run: python -m unittest discover -s automation/hydrogen-daily -p "test_*.py" -v

      - name: Build report and optionally send email
        run: python automation/hydrogen-daily/daily_report.py

      - name: Upload HTML preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hydrogen-daily-report-preview
          path: dist/hydrogen-industry-daily-report.html
          if-no-files-found: ignore
          retention-days: 7
