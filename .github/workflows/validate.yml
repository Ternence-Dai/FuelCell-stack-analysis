name: Validate standalone app
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  inline-javascript:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate current-density solver branch
        run: node scripts/validate-solver.cjs
      - name: Validate readable typography and focus states
        run: node scripts/validate-readability.cjs
      - name: Parse embedded JavaScript
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const { execFileSync } = require('node:child_process');
          const html = fs.readFileSync('index.html', 'utf8') + '\\n<script>' + fs.readFileSync('assets/js/legacy-app.js', 'utf8') + '</script>';
          const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script\s*>/gi)];
          const executable = scripts.filter(([, attrs]) => {
            const type = (attrs.match(/\btype=["']([^"']+)["']/i) || [])[1] || '';
            return !type || /^(module|text\/javascript|application\/javascript)$/i.test(type);
          });
          if (!executable.length) throw new Error('No inline executable JavaScript found');
          const dir = fs.mkdtempSync(path.join(os.tmpdir(), 'inline-js-'));
          executable.forEach(([, , source], index) => {
            const file = path.join(dir, `script-${index + 1}.js`);
            fs.writeFileSync(file, source);
            execFileSync(process.execPath, ['--check', file], { stdio: 'inherit' });
          });
          console.log(`Syntax OK: ${executable.length} inline script(s)`);
          NODE
      - name: Validate Nernst pressure units
        run: node scripts/validate-nernst.cjs
      - name: Validate coolant thermal-flow units
        run: node scripts/validate-thermal-flow.cjs
      - name: Validate global stack database provenance labels
        run: node scripts/validate-global-database.cjs
      - name: Validate engineering model scope disclosure
        run: node scripts/validate-model-assurance.cjs

  browser-engineering:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save --package-lock=false playwright
      - name: Install Chromium
        run: npx playwright install --with-deps --only-shell chromium
      - name: Serve the standalone engineering workspace
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/hyhub-http.log 2>&1 &
          echo $! > /tmp/hyhub-http.pid
          for attempt in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/hyhub-http.log
          exit 1
      - name: Verify dashboard, solver, simulation, calculations and mobile navigation
        run: node scripts/browser-engineering-smoke.cjs
